name: Update README

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: hafizhsul
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate pacman contribution graph
        run: |
          set +e
          mkdir -p dist
          npx --yes pacman-contribution-graph --game pacman --username hafizhsul --platform github --output dist/pacman-contribution-graph.svg > npx1.log 2>&1
          rc1=$?
          npx --yes pacman-contribution-graph --game pacman --username hafizhsul --platform github --gameTheme github-dark --output dist/pacman-contribution-graph-dark.svg > npx2.log 2>&1
          rc2=$?
          cat npx1.log npx2.log
          if [ $rc1 -ne 0 ] || [ $rc2 -ne 0 ]; then
            printf 'pacman rc1=%s rc2=%s\n' "$rc1" "$rc2" > "$GITHUB_STEP_SUMMARY"
            tail -30 npx1.log npx2.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Commit snake + pacman svg
        run: |
          cp dist/github-contribution-grid-snake*.svg .
          cp dist/pacman-contribution-graph*.svg .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-contribution-grid-snake*.svg pacman-contribution-graph*.svg
          git commit -m "chore: update contribution snake + pacman" || echo "No snake/pacman changes"

      - name: Update recent activity
        uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: "chore: update recent activity"
          MAX_LINES: 5

      - name: Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git push
